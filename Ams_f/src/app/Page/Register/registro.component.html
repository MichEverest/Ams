<div class="container center">
  <div class="login-card">
    
    <!-- Panel Izquierdo: Formulario de Registro -->
    <div class="form-section">
      <div class="header-section">
        <h2>Crea tu cuenta</h2>
        <p class="subtitle">Únete a Ams</p>
      </div>
      <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
        <div class="input-row">
          <div class="input-group">
            <input formControlName="name" placeholder="Nombre completo" />
          </div>
        </div>
        <div class="input-group">
          <input formControlName="email" placeholder="Correo electrónico" />
        </div>
        <div class="input-row">
          <div class="input-group">
            <input type="password" formControlName="password" placeholder="Contraseña" />
          </div>
          <div class="input-group">
            <input type="password" formControlName="confirmPassword" placeholder="Confirmar" />
          </div>
        </div>
        <button type="submit" [disabled]="registerForm.invalid || loading" class="btn-primary">
          {{ loading ? 'Creando cuenta...' : 'Compra' }}
        </button>
        <div class="divider">
          <span>O regístrate con</span>
        </div>
        <div class="social-login">
          <button type="button" class="social-btn"><i class="bi bi-google"></i></button>
          <button type="button" class="social-btn"><i class="bi bi-twitter-x"></i></button>
          <button type="button" class="social-btn"><i class="bi bi-github"></i></button>
        </div>
        <div class="register-link">
          ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
        </div>
      </form>
    </div>

    <!-- Panel Derecho: Visual Informativo -->
    <div class="visual-section">
      <div class="visual-content">
        <div class="feature-badge">Nuevo</div>
        <h3>X</h3>
        <p>Desarrollo.</p>
        <img src="assets/img/register-preview.png" alt="Registro" class="product-preview" />
      </div>
    </div>
  </div>
</div>

<!-- Mantenemos tu soporte flotante -->
<div class="support" routerLink="/soporte">
  <div class="bubble">Atención al cliente</div>
  <img src="https://i2.wp.com/images.genshin-builds.com/genshin/characters/mualani/image.png?strip=all&quality=100&w=160" alt="soporte" />
</div>
