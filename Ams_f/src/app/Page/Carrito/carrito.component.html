<div class="cart-card">
  <h2><i class="bi bi-cart3"></i> Lista de Compra</h2>
  
  @if (cartItems().length === 0) {
    <div class="cart-empty">
      <p>El carrito está vacío.</p>
    </div>
  } @else {
    <div class="cart-list">
      @for (item of cartItems(); track item.product.id) {
        <div class="cart-item">
          <div class="item-info">
            <h4>{{ item.product.name }}</h4>
            <span class="item-price">${{ item.product.price | number:'1.2-2' }}</span>
          </div>
          
          <div class="item-actions">
            <input 
              type="number" 
              [value]="item.quantity" 
              (change)="onQuantityChange(item.product.id, $event)"
              min="1"
            />
            <button class="btn-remove" (click)="removeItem(item.product.id)">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      }

      <div class="cart-summary">
        <div class="summary-row">
          <span>Items:</span>
          <span>{{ cartCount() }}</span>
        </div>
        <div class="summary-row total">
          <span>Total:</span>
          <span>${{ total() | number:'1.2-2' }}</span>
        </div>
        <button class="btn-checkout" (click)="processPayment()">
          Confirmar Compra
        </button>
      </div>
    </div>
  }
</div>
